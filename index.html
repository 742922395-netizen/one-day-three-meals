<!DOCTYPE html>
<html lang="zh-CN"><link rel="apple-touch-icon" href="F5FB4BBD-29AB-4561-81BC-119B19A32006.png">
<link rel="icon" href="F5FB4BBD-29AB-4561-81BC-119B19A32006.png">
<meta name="theme-color" content="#FFF8F0">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>一日三餐</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#f7f0e7;
  color:#3d3936;
}

button,input,textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  max-width:760px;
  margin:auto;
  min-height:100vh;
  padding:24px 18px 110px;
}

.top{
  margin-bottom:28px;
}

.back{
  background:none;
  color:#aaa29b;
  font-size:15px;
  padding:5px 0;
}

h1{
  font-size:36px;
  margin:22px 0 5px;
  letter-spacing:-1px;
}

.subtitle{
  color:#a49b92;
  font-size:16px;
}

.card{
  background:#fffdf9;
  border-radius:30px;
  padding:20px;
  margin:16px 0;
  box-shadow:0 8px 25px rgba(80,65,50,.07);
}

.meal-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:105px;
}

.meal-left{
  display:flex;
  align-items:center;
  gap:16px;
}

.meal-icon{
  width:65px;
  height:65px;
  border-radius:22px;
  background:#eee6dc;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
}

.meal-title{
  font-size:22px;
  font-weight:700;
}

.meal-selected{
  margin-top:5px;
  color:#a59b92;
  font-size:14px;
}

.arrow{
  font-size:28px;
  color:#b3aaa2;
}

.progress-card{
  padding:22px;
}

.progress-title{
  display:flex;
  justify-content:space-between;
  margin-bottom:12px;
  font-weight:600;
}

.progress-bg{
  height:12px;
  background:#eee7df;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#d7b9aa;
  border-radius:20px;
  transition:.3s;
}

.random{
  width:100%;
  padding:17px;
  border-radius:22px;
  background:#e8d7cc;
  color:#514842;
  font-weight:700;
  font-size:17px;
  margin-top:8px;
}

.option-card{
  display:flex;
  align-items:center;
  gap:20px;
}

.option-image{
  width:125px;
  height:125px;
  object-fit:cover;
  border-radius:25px;
  background:#eee8df;
  flex-shrink:0;
}

.option-info{
  flex:1;
}

.option-name{
  font-size:21px;
  font-weight:700;
  margin-bottom:7px;
}

.option-desc{
  color:#9d948c;
  margin-bottom:15px;
}

.choose{
  background:#eadbd2;
  color:#554b45;
  padding:11px 20px;
  border-radius:20px;
  font-weight:700;
}

.section-title{
  font-size:25px;
  font-weight:700;
  margin:20px 0 12px;
}

.form{
  background:#fffdf9;
  border-radius:28px;
  padding:20px;
  margin-top:15px;
}

label{
  display:block;
  font-weight:600;
  margin:14px 0 7px;
}

input[type=text],
textarea,
select{
  width:100%;
  border:0;
  outline:0;
  background:#f3eee7;
  border-radius:16px;
  padding:14px;
  color:#403a36;
}

textarea{
  min-height:90px;
  resize:none;
}

.photo-btn{
  display:block;
  width:100%;
  padding:15px;
  background:#f0e4db;
  border-radius:18px;
  text-align:center;
  margin-top:10px;
  font-weight:600;
}

.file-name{
  color:#aaa099;
  font-size:13px;
  margin-top:7px;
}

.save-btn{
  width:100%;
  padding:16px;
  background:#d8b8a8;
  color:white;
  border-radius:20px;
  margin-top:18px;
  font-weight:700;
}

.my-item{
  display:flex;
  align-items:center;
  gap:14px;
  padding:15px 0;
  border-bottom:1px solid #eee7df;
}

.my-item:last-child{
  border-bottom:0;
}

.small-image{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:18px;
  background:#eee8df;
}

.my-info{
  flex:1;
}

.my-name{
  font-weight:700;
  font-size:17px;
}

.my-type{
  color:#aaa099;
  font-size:13px;
  margin-top:4px;
}

.action-row{
  display:flex;
  gap:7px;
  margin-top:8px;
}

.change-photo,
.delete-btn{
  padding:7px 11px;
  border-radius:13px;
  font-size:13px;
}

.change-photo{
  background:#eee2d9;
}

.delete-btn{
  background:#f1e5e0;
  color:#a06d60;
}

.bottom{
  position:fixed;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  width:min(92%,700px);
  background:#fffdf9;
  border-radius:30px;
  padding:12px;
  display:flex;
  box-shadow:0 10px 35px rgba(60,45,30,.13);
  z-index:10;
}

.nav-btn{
  flex:1;
  background:none;
  color:#aaa099;
  padding:7px;
  font-size:14px;
}

.nav-btn.active{
  color:#514943;
  font-weight:700;
}

.nav-icon{
  display:block;
  font-size:24px;
  margin-bottom:3px;
}

.hidden{
  display:none!important;
}

.empty{
  text-align:center;
  color:#aaa099;
  padding:25px 0;
}

@media(max-width:500px){
  .option-image{
    width:105px;
    height:105px;
  }

  .option-card{
    gap:15px;
  }

  h1{
    font-size:34px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- 首页 -->
  <section id="homePage">
    <div class="top">
      <h1>🍚 今天吃什么？</h1>
      <div class="subtitle">好好吃饭，好好生活 ♡</div>
    </div>

    <div id="homeMeals"></div>

    <div class="card progress-card">
      <div class="progress-title">
        <span>今日进度</span>
        <span id="progressText">0 / 3</span>
      </div>

      <div class="progress-bg">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <button class="random" onclick="randomAll()">
      🎲 今天不想选，帮我决定
    </button>
  </section>

  <!-- 选择页面 -->
  <section id="choicePage" class="hidden">
    <div class="top">
      <button class="back" onclick="goHome()">‹ 返回</button>
      <h1 id="choiceTitle">🍱 午餐</h1>
      <div class="subtitle">选一个你今天想吃的吧 ♡</div>
    </div>

    <div id="options"></div>
  </section>

  <!-- 我的菜单 -->
  <section id="menuPage" class="hidden">
    <div class="top">
      <h1>♡ 我的菜单</h1>
      <div class="subtitle">把喜欢吃的东西都放进来</div>
    </div>

    <div class="form">
      <div class="section-title">添加一道菜</div>

      <label>菜名</label>
      <input id="foodName" type="text" placeholder="比如：番茄鸡蛋面">

      <label>属于哪一餐？</label>
      <select id="foodType">
        <option value="breakfast">🥐 早餐</option>
        <option value="lunch">🍱 午餐</option>
        <option value="dinner">🍲 晚餐</option>
      </select>

      <label>照片</label>

      <input
        id="photoInput"
        class="hidden"
        type="file"
        accept="image/*"
        onchange="showFileName()"
      >

      <label class="photo-btn" for="photoInput">
        📷 从相册选择照片
      </label>

      <div id="fileName" class="file-name">
        还没有选择照片
      </div>

      <label>描述</label>
      <textarea id="foodDesc" placeholder="比如：今天特别想吃～"></textarea>

      <button class="save-btn" onclick="addFood()">
        保存这道菜 ♡
      </button>
    </div>

    <div class="section-title">我的菜品</div>
    <div class="card" id="myFoods"></div>
  </section>

</div>

<!-- 底部导航 -->
<div class="bottom">
  <button class="nav-btn active" id="homeNav" onclick="goHome()">
    <span class="nav-icon">🍽️</span>
    今日三餐
  </button>

  <button class="nav-btn" id="menuNav" onclick="goMenu()">
    <span class="nav-icon">♡</span>
    我的菜单
  </button>
</div>

<script>

const defaultMenu = {
  breakfast:[
    {name:"早餐选项 1",image:"",desc:"开启元气的一天"},
    {name:"早餐选项 2",image:"",desc:"简单又满足"},
    {name:"早餐选项 3",image:"",desc:"今天也要好好吃饭"}
  ],

  lunch:[
    {name:"午餐选项 1",image:"",desc:"好好吃午饭"},
    {name:"午餐选项 2",image:"",desc:"今天想吃这个"},
    {name:"午餐选项 3",image:"",desc:"幸福感满满"}
  ],

  dinner:[
    {name:"晚餐选项 1",image:"",desc:"给今天一个温柔的收尾"},
    {name:"晚餐选项 2",image:"",desc:"晚上也要好好吃饭"},
    {name:"晚餐选项 3",image:"",desc:"舒服地结束一天"}
  ]
};

let menu =
  JSON.parse(localStorage.getItem("mealMenu"))
  || JSON.parse(JSON.stringify(defaultMenu));

let selected =
  JSON.parse(localStorage.getItem("todayMeals"))
  || {};

let currentType = null;


/* =========================
   IndexedDB：保存手机照片
========================= */

let db;

function openDB(){
  return new Promise((resolve,reject)=>{
    const request=indexedDB.open("MealPhotoDB",1);

    request.onupgradeneeded=function(e){
      const database=e.target.result;

      if(!database.objectStoreNames.contains("photos")){
        database.createObjectStore("photos");
      }
    };

    request.onsuccess=function(e){
      db=e.target.result;
      resolve(db);
    };

    request.onerror=function(){
      reject(request.error);
    };
  });
}

async function savePhoto(file){

  await openDB();

  const dataUrl=await resizeImage(file);

  const key="photo_"+Date.now()+"_"+Math.random();

  return new Promise((resolve,reject)=>{

    const tx=db.transaction("photos","readwrite");

    tx.objectStore("photos").put(dataUrl,key);

    tx.oncomplete=()=>{
      resolve(key);
    };

    tx.onerror=()=>{
      reject(tx.error);
    };

  });
}

async function getPhoto(key){

  if(!key || !key.startsWith("photo_")){
    return key || "";
  }

  await openDB();

  return new Promise((resolve)=>{

    const tx=db.transaction("photos","readonly");

    const request=tx.objectStore("photos").get(key);

    request.onsuccess=()=>{
      resolve(request.result || "");
    };

    request.onerror=()=>{
      resolve("");
    };

  });
}

function deletePhoto(key){

  if(!key || !key.startsWith("photo_") || !db) return;

  const tx=db.transaction("photos","readwrite");

  tx.objectStore("photos").delete(key);
}


/* =========================
   压缩照片
========================= */

function resizeImage(file){

  return new Promise((resolve,reject)=>{

    const reader=new FileReader();

    reader.onload=function(){

      const img=new Image();

      img.onload=function(){

        const max=1200;

        let width=img.width;
        let height=img.height;

        if(width>max || height>max){

          if(width>height){
            height=height*max/width;
            width=max;
          }else{
            width=width*max/height;
            height=max;
          }

        }

        const canvas=document.createElement("canvas");

        canvas.width=width;
        canvas.height=height;

        const ctx=canvas.getContext("2d");

        ctx.drawImage(img,0,0,width,height);

        resolve(
          canvas.toDataURL("image/jpeg",0.82)
        );
      };

      img.onerror=reject;

      img.src=reader.result;
    };

    reader.onerror=reject;

    reader.readAsDataURL(file);

  });
}


/* =========================
   保存菜单
========================= */

function saveMenu(){
  localStorage.setItem(
    "mealMenu",
    JSON.stringify(menu)
  );
}


/* =========================
   图片显示
========================= */

async function imageSrc(image){

  if(!image){
    return "data:image/svg+xml;charset=UTF-8,"+
      encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">
          <rect width="100%" height="100%" fill="#eee8df"/>
          <text x="50%" y="53%" text-anchor="middle"
            font-size="70">🍽️</text>
        </svg>
      `);
  }

  return await getPhoto(image);
}


/* =========================
   首页
========================= */

function renderHome(){

  const box=document.getElementById("homeMeals");

  const types=[
    ["breakfast","🥐","早餐"],
    ["lunch","🍱","午餐"],
    ["dinner","🍲","晚餐"]
  ];

  box.innerHTML="";

  types.forEach(([type,icon,title])=>{

    const item=selected[type];

    const card=document.createElement("div");

    card.className="card meal-card";

    card.onclick=()=>{
      openChoice(type);
    };

    card.innerHTML=`
      <div class="meal-left">
        <div class="meal-icon">${icon}</div>
        <div>
          <div class="meal-title">${title}</div>
          <div class="meal-selected">
            ${item ? item : "还没有选择"}
          </div>
        </div>
      </div>

      <div class="arrow">›</div>
    `;

    box.appendChild(card);

  });

  updateProgress();
}


/* =========================
   选择页面
========================= */

function openChoice(type){

  currentType=type;

  document.getElementById("homePage")
    .classList.add("hidden");

  document.getElementById("menuPage")
    .classList.add("hidden");

  document.getElementById("choicePage")
    .classList.remove("hidden");

  const names={
    breakfast:"🥐 早餐",
    lunch:"🍱 午餐",
    dinner:"🍲 晚餐"
  };

  document.getElementById("choiceTitle").innerText=
    names[type];

  renderOptions();
}

async function renderOptions(){

  const box=document.getElementById("options");

  box.innerHTML="";

  for(let i=0;i<menu[currentType].length;i++){

    const food=menu[currentType][i];

    const card=document.createElement("div");

    card.className="card option-card";

    const img=document.createElement("img");

    img.className="option-image";

    img.src=await imageSrc(food.image);

    img.onerror=function(){
      this.src=imageSrc("");
    };

    const info=document.createElement("div");

    info.className="option-info";

    info.innerHTML=`
      <div class="option-name">
        ${escapeHtml(food.name)}
      </div>

      <div class="option-desc">
        ${escapeHtml(food.desc || "")}
      </div>
    `;

    const btn=document.createElement("button");

    btn.className="choose";

    btn.innerText="选择这个";

    btn.onclick=function(){
      selectFood(food.name);
    };

    info.appendChild(btn);

    card.appendChild(img);
    card.appendChild(info);

    box.appendChild(card);
  }
}

function selectFood(name){

  selected[currentType]=name;

  localStorage.setItem(
    "todayMeals",
    JSON.stringify(selected)
  );

  goHome();
}


/* =========================
   随机选择
========================= */

function randomAll(){

  ["breakfast","lunch","dinner"].forEach(type=>{

    if(menu[type].length){

      const random=
        menu[type][
          Math.floor(Math.random()*menu[type].length)
        ];

      selected[type]=random.name;
    }

  });

  localStorage.setItem(
    "todayMeals",
    JSON.stringify(selected)
  );

  renderHome();
}


/* =========================
   进度
========================= */

function updateProgress(){

  const count=
    ["breakfast","lunch","dinner"]
    .filter(x=>selected[x]).length;

  document.getElementById("progressText")
    .innerText=count+" / 3";

  document.getElementById("progressBar")
    .style.width=(count/3*100)+"%";
}


/* =========================
   我的菜单
========================= */

function goMenu(){

  document.getElementById("homePage")
    .classList.add("hidden");

  document.getElementById("choicePage")
    .classList.add("hidden");

  document.getElementById("menuPage")
    .classList.remove("hidden");

  document.getElementById("homeNav")
    .classList.remove("active");

  document.getElementById("menuNav")
    .classList.add("active");

  renderMyFoods();
}

function goHome(){

  document.getElementById("homePage")
    .classList.remove("hidden");

  document.getElementById("choicePage")
    .classList.add("hidden");

  document.getElementById("menuPage")
    .classList.add("hidden");

  document.getElementById("homeNav")
    .classList.add("active");

  document.getElementById("menuNav")
    .classList.remove("active");

  renderHome();
}


/* =========================
   添加菜品
========================= */

function showFileName(){

  const input=document.getElementById("photoInput");

  document.getElementById("fileName").innerText=
    input.files.length
      ? "已选择："+input.files[0].name
      : "还没有选择照片";
}

async function addFood(){

  const name=
    document.getElementById("foodName")
      .value.trim();

  const type=
    document.getElementById("foodType").value;

  const desc=
    document.getElementById("foodDesc")
      .value.trim();

  const input=
    document.getElementById("photoInput");

  if(!name){

    alert("先写一下菜名哦 ♡");

    return;
  }

  let image="";

  if(input.files.length){

    try{

      image=await savePhoto(input.files[0]);

    }catch(e){

      alert("照片保存失败，请再试一次");

      return;
    }
  }

  menu[type].push({
    name:name,
    image:image,
    desc:desc || "今天也要好好吃饭"
  });

  saveMenu();

  document.getElementById("foodName").value="";
  document.getElementById("foodDesc").value="";
  input.value="";
  document.getElementById("fileName").innerText=
    "还没有选择照片";

  renderMyFoods();

  alert("添加成功啦 ♡");
}


/* =========================
   我的菜品列表
========================= */

async function renderMyFoods(){

  const box=document.getElementById("myFoods");

  box.innerHTML="";

  const types=[
    ["breakfast","🥐 早餐"],
    ["lunch","🍱 午餐"],
    ["dinner","🍲 晚餐"]
  ];

  let total=0;

  for(const [type,typeName] of types){

    for(let i=0;i<menu[type].length;i++){

      total++;

      const food=menu[type][i];

      const row=document.createElement("div");

      row.className="my-item";

      const img=document.createElement("img");

      img.className="small-image";

      img.src=await imageSrc(food.image);

      const info=document.createElement("div");

      info.className="my-info";

      info.innerHTML=`
        <div class="my-name">
          ${escapeHtml(food.name)}
        </div>

        <div class="my-type">
          ${typeName}
        </div>
      `;

      const actions=document.createElement("div");

      actions.className="action-row";

      const photoBtn=document.createElement("button");

      photoBtn.className="change-photo";

      photoBtn.innerText="📷 换照片";

      photoBtn.onclick=()=>{
        changePhoto(type,i);
      };

      const deleteBtn=document.createElement("button");

      deleteBtn.className="delete-btn";

      deleteBtn.innerText="删除";

      deleteBtn.onclick=()=>{
        deleteFood(type,i);
      };

      actions.appendChild(photoBtn);
      actions.appendChild(deleteBtn);

      info.appendChild(actions);

      row.appendChild(img);
      row.appendChild(info);

      box.appendChild(row);
    }
  }

  if(!total){

    box.innerHTML=
      `<div class="empty">还没有菜品 ♡</div>`;
  }
}


/* =========================
   给已有菜品换照片
========================= */

async function changePhoto(type,index){

  const input=document.createElement("input");

  input.type="file";
  input.accept="image/*";

  input.onchange=async function(){

    if(!input.files.length) return;

    try{

      const oldImage=menu[type][index].image;

      const newImage=
        await savePhoto(input.files[0]);

      menu[type][index].image=newImage;

      saveMenu();

      if(oldImage && oldImage.startsWith("photo_")){
        deletePhoto(oldImage);
      }

      renderMyFoods();

    }catch(e){

      alert("照片保存失败，请再试一次");
    }
  };

  input.click();
}


/* =========================
   删除菜品
========================= */

function deleteFood(type,index){

  const food=menu[type][index];

  if(!confirm("确定要删除这道菜吗？")){
    return;
  }

  if(food.image){
    deletePhoto(food.image);
  }

  menu[type].splice(index,1);

  saveMenu();

  renderMyFoods();
}


/* =========================
   防止特殊字符
========================= */

function escapeHtml(str){

  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   启动
========================= */

renderHome();

</script>

</body>
</html>
